        quantityReceived:
          type: number
          nullable: true
          description: 'Actual quantity received on this receipt line: SUM(tpoRcvrLineDist.QtyRcvd), grouped
            by RcvrLineKey. NOT the cumulative PO received quantity.'
          example: 600
        quantityReceivedSourceUOM:
          type: number
          nullable: true
          description: Actual received quantity for this receiver line in source unit of measure; SUM(tpoRcvrLineDist.QtyRcvdInSrcUOM)
            grouped by RcvrLineKey.
        poCumulativeQuantityReceived:
          type: number
          nullable: true
          description: Cumulative quantity received for the linked PO line; tpoPOLineDist.QtyRcvd. This is
            NOT the quantity of this individual goods receipt.
        quantityInvoiced:
          type: number
          nullable: true
          description: Quantity invoiced from Sage PO line distribution data.
          example: 0
        quantityOpenToReceive:
          type: number
          nullable: true
          description: Quantity still open to receive from Sage PO line distribution data.
          example: 0
        quantityReturnedForCredit:
          type: number
          nullable: true
          description: Quantity returned for credit from Sage PO line distribution data.
          example: 0
        quantityReturnedForReplacement:
          type: number
          nullable: true
          description: Quantity returned for replacement from Sage PO line distribution data.
          example: 0
        glAccountKey:
          type: integer
          nullable: true
          description: Sage G/L account key from PO line distribution.
          example: 568000
