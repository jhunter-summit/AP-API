    QuadientInvoiceRequest:
      type: object
      required:
      - invoiceNumber
      - invoiceDate
      - dueDate
      - totalAmount
      - lines
      properties:
        invoiceNumber:
          type: string
          maxLength: 50
          example: INV-12345
        invoiceType:
          type: string
          description: '

            Invoice processing type. Official values are PO_MATCHED and TWO_WAY.

            PO_MATCHED is used for PO/receipt matched invoices and may also include

            ADDITIONAL_CHARGE lines such as freight, tariff, packaging, or miscellaneous

            charges. TWO_WAY is used for non-PO / 2-way invoices. If omitted, the API

            treats the invoice as PO_MATCHED. The API also normalizes common variants

            such as "TWO WAY", "2 WAY", "NON_PO", "THREE WAY", and "3 WAY".

            '
          enum:
          - PO_MATCHED
          - TWO_WAY
          example: PO_MATCHED
        vendorKey:
          type: integer
          nullable: true
          description: Sage 500 tapVendor.VendKey. Preferred vendor identifier for Sage/DIM processing.
          example: 123
        vendorId:
          type: string
          nullable: true
          maxLength: 50
          description: Human-readable Sage vendor ID. Useful for audit/debugging.
          example: INSUL
        invoiceDate:
          type: string
          format: date
          example: '2026-05-07'
          description: Original vendor invoice date. Used as Sage Pending AP Voucher TranDate and InvcRcptDate.
        dueDate:
          type: string
          format: date
          example: '2026-06-06'
        memo:
          type: string
          nullable: true
          example: 3-way matched invoice from Beanworks
        beanworksInvoiceUrl:
          type: string
          nullable: true
          format: uri
          example: https://app.beanworks.com/invoices/12345
        currency:
          type: string
          nullable: true
          maxLength: 10
          example: USD
        companyId:
          type: string
          nullable: true
          maxLength: 20
          example: '001'
        totalAmount:
          type: number
          format: double
          example: 125.0
        exportDate:
          type: string
          format: date
          example: '2026-08-05'
          description: Quadient export date; used as Sage Pending AP Voucher PostDate if supplied. If absent
            the API stores the receive date as ExportDate.
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/QuadientInvoiceLineRequest'
      description: One invoice per POST request. Either vendorKey or vendorId must be supplied; vendorKey is
        preferred for Sage/DIM processing.
    QuadientInvoiceLineRequest:
      oneOf:
      - $ref: '#/components/schemas/QuadientPoMatchedInvoiceLineRequest'
      - $ref: '#/components/schemas/QuadientTwoWayInvoiceLineRequest'
    QuadientPoMatchedInvoiceLineRequest:
      type: object
      required:
      - unitCost
      - quantity
      - lineAmount
      - poLineKey
      - rcvrLineKey
      - glAccountKey
      properties:
        lineNumber:
          type: integer
          nullable: true
          example: 1
        lineType:
          type: string
          nullable: true
          description: '

            Optional line type. Use PO_MATCHED for receipt-matched PO lines.

            Use ADDITIONAL_CHARGE for freight, tariff, packaging, or miscellaneous

            charges on a PO invoice that do not have poLineKey or rcvrLineKey.

            If omitted, the API infers the line type from whether poLineKey or

            rcvrLineKey is present.

            '
          enum:
          - PO_MATCHED
          - ADDITIONAL_CHARGE
          example: PO_MATCHED
        glAccountKey:
          type: integer
          description: Sage 500 G/L account key for this invoice line.
          example: 80001
        glAccountNumber:
          type: string
          nullable: true
          description: '

            Optional display G/L account number supplied by Quadient for audit/display.

            The integration key remains glAccountKey.

            '
          example: 5000-100-200
        glAccountDescription:
          type: string
          nullable: true
          description: '

            Optional display G/L account description supplied by Quadient for audit/display.

            '
          example: Freight and tariff expense
        itemKey:
          type: integer
          nullable: true
          example: 456
        itemId:
          type: string
          nullable: true
          example: TESTITEM
        unitCost:
          type: number
          format: decimal
          example: 12.5
        quantity:
          type: number
          format: decimal
          example: 10
        unitMeasure:
          type: string
          nullable: true
          example: EA
        lineAmount:
          type: number
          format: decimal
          example: 125
        poKey:
          type: integer
          nullable: true
          example: 10001
        poNumber:
          type: string
          nullable: true
          example: PO-TEST-001
        poLineKey:
          type: integer
          description: Sage 500 tpoPOLine.POLineKey.
          example: 20001
        poLineNumber:
          type: integer
          nullable: true
          example: 1
        rcvrLineKey:
          type: integer
          description: Sage 500 tpoRcvrLine.RcvrLineKey. Critical 3-way match identifier.
          example: 30001
        description:
          type: string
          nullable: true
          example: Test PO-matched invoice line
        sTaxClassKey:
          type: integer
          nullable: true
          example: null
        department:
          type: string
          nullable: true
          example: TEST
        costCenter:
          type: string
          nullable: true
          example: TEST
        quantityOrdered:
          type: number
          nullable: true
          example: 10
        quantityReceived:
          type: number
          nullable: true
          example: 10
        quantityInvoiced:
          type: number
          nullable: true
          example: 10
        quantityOpenToReceive:
          type: number
          nullable: true
          example: 0
        quantityReturnedForCredit:
          type: number
          nullable: true
          example: 0
        quantityReturnedForReplacement:
          type: number
          nullable: true
          example: 0
    QuadientTwoWayInvoiceLineRequest:
      type: object
      required:
      - lineAmount
      - glAccountKey
      properties:
        lineNumber:
          type: integer
          nullable: true
          example: 1
        lineType:
          type: string
          nullable: true
          description: '

            Optional line type. TWO_WAY invoice lines are treated as non-PO /

            additional charge lines. If omitted, the API treats the line as

            ADDITIONAL_CHARGE.

            '
          enum:
          - ADDITIONAL_CHARGE
          example: ADDITIONAL_CHARGE
        description:
          type: string
          description: Optional; if omitted, API uses the invoice memo or a generated fallback description.
          example: 2-way invoice expense line
        lineAmount:
          type: number
          format: decimal
          example: 125
        glAccountKey:
          type: integer
          description: Sage G/L account key. Required for all TWO_WAY / non-PO invoice lines.
          example: 80001
        glAccountNumber:
          type: string
          nullable: true
          description: '

            Optional display G/L account number supplied by Quadient for audit/display.

            The integration key remains glAccountKey.

            '
          example: 5000-100-200
        glAccountDescription:
          type: string
          nullable: true
          description: '

            Optional display G/L account description supplied by Quadient for audit/display.

