        vendorId:
          type: string
          example: INSUL
        vendorName:
          type: string
          example: Insulectro (EFT)
        receiptLineKey:
          type: integer
          example: 149778
          description: Sage tpoRcvrLine.RcvrLineKey; unique receipt line identifier.
        receiptLineNumber:
          type: integer
          nullable: true
          example: 1
        poLineKey:
          type: integer
          nullable: true
          example: 147845
          description: Sage tpoRcvrLine.POLineKey; identifies the PO line associated with this receiver line.
        unitCost:
          type: number
          nullable: true
          example: 2.74
        taxAmount:
          type: number
          nullable: true
          example: 0
        poKey:
          type: integer
          nullable: true
          description: Sage tpoPurchOrder.POKey; purchase-order header linkage key required for Quadient to
            associate goods receipts with POs. Null when no linked PO is resolved.
          example: 192059
        poNumber:
          type: string
          nullable: true
          example: 0000071995
        poLineNumber:
          type: integer
          nullable: true
          example: 1
        itemKey:
          type: integer
          nullable: true
          example: 456
        lineDescription:
          type: string
          nullable: true
          example: Paco Plus 18x24 8-Hole
        quantityOrdered:
          type: number
          nullable: true
