    Receipt:
      type: object
      properties:
        receiptKey:
          type: integer
          example: 34300
          description: Sage tpoReceiver.RcvrKey; identifies the receiving transaction header.
        receiptNumber:
          type: string
          example: '0000034300'
        receiptDate:
          type: string
          format: date-time
          nullable: true
          example: '2026-04-27T00:00:00.000Z'
        companyId:
          type: string
