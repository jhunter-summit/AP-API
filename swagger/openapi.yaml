openapi: 3.0.3
info:
  title: Summit / Quadient / Sage 500 AP Integration API
  version: 1.3.0
  description: 'API for Quadient Beanworks to retrieve Sage 500 reference and transactional data and submit
    invoices to Summit for Sage processing.


    GET endpoints include companies, G/L accounts, customers, vendors, purchase orders, receiving information,
    open AP invoices, and customer statements. Inbound invoice POST requests are stored in Quadient staging
    before separate Sage import processing.


    Most incremental GET endpoints support updatedSince; semantics vary by endpoint. Dates are supplied by
    Sage. The consumer is responsible for retaining its last successful synchronization watermark and paging
    as required. x-api-key authentication is required for protected endpoints.


    IMPORTANT: /receipts returns one row per receipt line; receiptKey identifies its header, receiptLineKey
    identifies its line, poKey identifies the corresponding purchase order, and poLineKey identifies its PO
    line. Some non-PO receiving lines can legitimately have null PO identifiers.

    '
servers:
- url: https://sicxyz001.summitinterconnect.com/
  description: Live endpoint
security:
- ApiKeyAuth: []
tags:
- name: Diagnostics
- name: Reference
- name: GL Accounts
- name: Customers
- name: Vendors
- name: Purchase Orders
- name: Receipts
- name: AP Invoices
- name: AR Statements
- name: Quadient Inbound
paths:
  /health:
    get:
      summary: Health check
      description: Returns basic API health information. This endpoint may be left unauthenticated depending
        on deployment configuration.
      tags:
      - Diagnostics
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
      security: []
  /db-test:
    get:
      summary: Test database connectivity
      description: Tests whether the API can connect to the Sage 500 SQL Server database.
      tags:
      - Diagnostics
      responses:
        '200':
          description: Database connection successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbTestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /companies:
    get:
      summary: Get companies
      description: Returns companies available from Sage 500.
      tags:
      - Reference
      responses:
        '200':
          description: Companies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /gl-accounts:
    get:
      summary: Get G/L account list
      description: '

        Returns current active Sage 500 G/L accounts. Account numbers may repeat

        across companies/entities, so consumers should treat glAccountKey as the

        stable unique identifier. The endpoint supports page/pageSize pagination

        and also offset/pageSize pagination. If both page and offset are supplied,

        offset takes priority.

        '
      tags:
      - GL Accounts
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/UpdatedSince'
      responses:
        '200':
          description: List of current active G/L accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    type: integer
                    example: 1
                  pageSize:
                    type: integer
                    example: 500
                  offset:
                    type: integer
                    example: 0
                  count:
                    type: integer
                    example: 500
                  totalCount:
                    type: integer
                    example: 3370
                  totalPages:
                    type: integer
                    example: 7
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        glAccountKey:
                          type: integer
                          example: 12345
                        companyId:
                          type: string
                          example: SSC
                        glAccountNumber:
                          type: string
                          example: 5000-100-200
                        glAccountDescription:
                          type: string
                          example: Materials Expense
                        status:
                          type: integer
                          example: 1
                        updatedAt:
                          type: string
                          format: date-time
                          example: '2026-05-18T12:00:00.000Z'
              example:
                page: 1
                pageSize: 500
                offset: 0
                count: 500
                totalCount: 3370
                totalPages: 7
                data:
                - glAccountKey: 12345
                  companyId: SSC
                  glAccountNumber: 5000-100-200
                  glAccountDescription: Materials Expense
                  status: 1
                  updatedAt: '2026-05-18T12:00:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /customers:
    get:
      summary: Get customer list
      tags:
      - Customers
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Customers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /vendors:
    get:
      summary: Get vendor list
      description: Returns vendors from Sage 500. VendKey should be used for Sage/DIM writeback matching when
        available.
      tags:
      - Vendors
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/UpdatedSince'
      responses:
        '200':
          description: Vendors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /purchase-orders:
    get:
      summary: Get purchase orders
      description: Returns purchase order headers with nested lines. updatedSince selects orders with po.CreateDate
        or po.UpdateDate on/after the supplied timestamp; poDate is the transaction date and may be backdated.
        Pagination applies to PO headers; the count value reports records in the current page, not the total
        matching orders.
      tags:
      - Purchase Orders
      parameters:
      - $ref: '#/components/parameters/UpdatedSince'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Purchase orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /receipts:
    get:
      summary: Get receiving information
      description: Returns a flat list of Sage receiving lines (not one object per receipt). Each line includes
        receiptKey, receiptLineKey, poKey, poLineKey and receipt-level quantities. updatedSince selects receipt
        headers whose CreateDate or UpdateDate is on/after the supplied timestamp, not their potentially backdated
        receiptDate. Pagination applies to individual receipt lines. poKey and poLineKey can be null if a receipt
        has no linked purchase order.
      tags:
      - Receipts
      parameters:
      - $ref: '#/components/parameters/UpdatedSince'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Receipt lines including PO linkage and actual receipt-line quantities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /invoices:
    get:
      summary: Get open AP invoices
      description: Returns open AP invoice headers from Sage 500. Open is currently determined by non-zero
        balance. Use /invoice-lines for invoice line detail, or /invoices-with-lines for a convenience/testing
        response that includes nested line items.
      tags:
      - AP Invoices
      parameters:
      - $ref: '#/components/parameters/UpdatedSince'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Open AP invoices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /invoice-lines:
    get:
      summary: Get AP invoice line items
      description: Returns AP invoice line detail records from Sage 500. This endpoint returns line items directly
        and includes related invoice/vendor context plus PO quantity information from the PO line distribution
        table.
      tags:
      - AP Invoices
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/UpdatedSince'
      - name: voucherKey
        in: query
        required: false
        description: Filter line items to a specific Sage voucher key.
        schema:
          type: integer
        example: 216838
      - name: invoiceNumber
        in: query
        required: false
        description: Filter line items to a specific invoice number.
        schema:
          type: string
        example: INV-12345
      responses:
        '200':
          description: Invoice line detail records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceLineList'
              example:
                page: 1
                pageSize: 100
                count: 1
                data:
                - voucherKey: 216838
                  invoiceNumber: INV-12345
                  invoiceDate: '2026-05-07T00:00:00.000Z'
                  dueDate: '2026-06-06T00:00:00.000Z'
                  companyId: '001'
                  vendKey: 12345
                  vendorId: INSUL
                  vendorName: Insulectro (EFT)
                  voucherLineKey: 393424
                  lineNumber: 1
                  poLineKey: 147845
                  rcvrLineKey: 149778
                  itemKey: 555
                  description: Invoice line description
                  extendedComment: null
                  unitCost: 12.5
                  unitCostExact: 12.5
                  unitMeasKey: 1
                  lineAmount: 125
                  sTaxClassKey: null
                  matchStatus: 2
                  returnType: 0
                  targetCompanyId: '001'
                  quantityOrdered: 10
                  quantityReceived: 10
                  quantityInvoiced: 10
                  quantityOpenToReceive: 0
                  quantityReturnedForCredit: 0
                  quantityReturnedForReplacement: 0
                  glAccountKey: 12345
                  calculatedInvoiceQuantity: 10
        '400':
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: VALIDATION_FAILED
                message: voucherKey must be a valid integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /invoices-with-lines:
    get:
      summary: Get open AP invoices with nested line items
      description: Convenience/testing endpoint that returns open AP invoice headers from Sage 500 with nested
        invoice line detail records. Production integrations may prefer the separate /invoices and /invoice-lines
        endpoints.
      tags:
      - AP Invoices
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/UpdatedSince'
      responses:
        '200':
          description: Open AP invoices with nested line detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceWithLinesList'
              example:
                page: 1
                pageSize: 100
                count: 1
                data:
                - voucherKey: 216838
                  companyId: '001'
                  invoiceNumber: INV-12345
                  invoiceDate: '2026-05-07T00:00:00.000Z'
                  postDate: null
                  invoiceReceiptDate: '2026-05-07T00:00:00.000Z'
                  dueDate: '2026-06-06T00:00:00.000Z'
                  invoiceAmount: 125
                  purchaseAmount: 125
                  balance: 125
                  statusCode: 2
                  status: Open
                  invoiceDescription: Invoice memo
                  createdAt: '2026-05-07T13:21:00.000Z'
                  updatedAt: '2026-05-07T13:21:00.000Z'
                  vendKey: 12345
                  vendorId: INSUL
                  vendorName: Insulectro (EFT)
                  lines:
                  - voucherLineKey: 393424
                    lineNumber: 1
                    poLineKey: 147845
                    rcvrLineKey: 149778
                    itemKey: 555
                    description: Invoice line description
                    extendedComment: null
                    unitCost: 12.5
                    unitCostExact: 12.5
                    unitMeasKey: 1
                    lineAmount: 125
                    sTaxClassKey: null
                    matchStatus: 2
                    returnType: 0
                    targetCompanyId: '001'
                    quantityOrdered: 10
                    quantityReceived: 10
                    quantityInvoiced: 10
                    quantityOpenToReceive: 0
                    quantityReturnedForCredit: 0
                    quantityReturnedForReplacement: 0
                    glAccountKey: 12345
                    calculatedInvoiceQuantity: 10
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /statements:
    get:
      summary: Get customer statement-style open AR data
      description: Returns open customer invoice/balance data used to generate statement-style information.
      tags:
      - AR Statements
      parameters:
      - $ref: '#/components/parameters/UpdatedSince'
      - name: customerId
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Statement data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /quadient/invoice:
    post:
      summary: Receive one invoice from Quadient Beanworks
      description: >-
        Receives invoice data from Quadient and stages it for Sage 500 import.
        PO_MATCHED invoices may include receipt-matched PO lines and ADDITIONAL_CHARGE
        lines such as freight and packaging. PO_MATCHED lines require poLineKey,
        rcvrLineKey, quantity, unitCost, lineAmount, and glAccountKey.
        ADDITIONAL_CHARGE lines do not require PO or receipt line keys, but do
        require lineAmount and glAccountKey. Optional G/L account descriptions
        support audit and display. An HTTP 201 confirms acceptance into Quadient
        staging, not successful Sage import. TWO_WAY invoices are marked ReadyForDIM;
        PO_MATCHED invoices are marked ThreeWayPending. During DIM processing,
        ordinary positive-quantity TWO_WAY lines may have UnitCost normalized
        to match LineAmount at two-decimal extended-amount precision.
      tags:
      - Quadient Inbound
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuadientInvoiceRequest'
            examples:
              poMatchedWithAdditionalCharge:
                summary: PO matched invoice with added freight/tariff charge
                value:
                  invoiceType: PO_MATCHED
                  invoiceNumber: TEST-GL-CHARGE-1001
                  vendorKey: 12345
                  vendorId: TESTVENDOR
                  invoiceDate: '2026-05-22'
                  dueDate: '2026-06-21'
                  memo: Test PO invoice with GL account info on added charge
                  beanworksInvoiceUrl: https://example.com/beanworks/invoice/TEST-GL-CHARGE-1001
                  currency: USD
                  companyId: SSC
                  totalAmount: 175.0
                  lines:
                  - lineType: PO_MATCHED
                    lineNumber: 1
                    itemKey: 1001
                    itemId: TESTITEM-001
                    unitCost: 25.0
                    quantity: 4
                    unitMeasure: EA
                    lineAmount: 100.0
                    poKey: 50001
                    poNumber: PO-TEST-001
                    poLineKey: 60001
                    poLineNumber: 1
                    rcvrLineKey: 70001
                    description: PO matched test line
                    sTaxClassKey: null
                    department: TEST
                    costCenter: TEST
                    glAccountKey: 80001
                    glAccountNumber: PO-GL-TEST
                    glAccountDescription: PO line GL account
                    quantityOrdered: 4
                    quantityReceived: 4
                    quantityInvoiced: 4
                    quantityOpenToReceive: 0
                    quantityReturnedForCredit: 0
                    quantityReturnedForReplacement: 0
                  - lineType: ADDITIONAL_CHARGE
                    lineNumber: 2
                    description: Tariff fee
                    lineAmount: 75.0
                    glAccountKey: 80002
                    glAccountNumber: TARIFF-GL-TEST
                    glAccountDescription: Tariff and freight expense
                    department: TEST
                    costCenter: TEST
                    sTaxClassKey: null
              twoWayInvoice:
                summary: 2-way / non-PO invoice
                value:
                  invoiceType: TWO_WAY
                  invoiceNumber: TEST-2WAY-1001
                  vendorKey: 12345
                  vendorId: TESTVENDOR
                  invoiceDate: '2026-05-22'
                  dueDate: '2026-06-21'
                  memo: Test 2-way invoice from Quadient API endpoint
                  beanworksInvoiceUrl: https://example.com/beanworks/invoice/TEST-2WAY-1001
                  currency: USD
                  companyId: SSC
                  totalAmount: 125.0
                  lines:
                  - lineType: ADDITIONAL_CHARGE
                    lineNumber: 1
                    description: 2-way invoice expense line
                    lineAmount: 125.0
                    glAccountKey: 80001
                    glAccountNumber: 2WAY-GL-TEST
                    glAccountDescription: 2-way expense GL account
                    department: TEST
                    costCenter: TEST
                    sTaxClassKey: null
      responses:
        '201':
          description: Invoice received and staged for DIM import
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuadientInvoiceResponse'
              example:
                status: received
                processingStatus: ReadyForDIM
                stagingId: 101
                invoiceNumber: TEST-BEAN-1001
                vendorKey: 123
                vendorId: TESTVENDOR
                exportDate: '2026-08-05'
                lineCount: 1
        '400':
          description: Payload validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                error: VALIDATION_FAILED
                message: Invoice payload failed validation
                details:
                - invoiceNumber is required
                - lines[0].rcvrLineKey is required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Invoice staging failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: INVOICE_RECEIVE_FAILED
                message: SQL insert failed
  /quadient/invoice/import-ready-batches:
    post:
      tags:
      - Quadient Inbound
      summary: Process eligible staged Quadient invoices through Sage import
      description: Operational endpoint. Picks up to batchSize eligible invoices; splits TWO_WAY invoices by
        company, export date and processing state and sends them to Sage Pending AP Voucher DIM. PO_MATCHED
        invoices follow the separate native 3-way processor and do not fall through to TWO_WAY. This is a write
        operation; restrict access to authorized internal clients.
      parameters:
      - name: batchSize
        in: query
        required: false
        schema:
          type: integer
          default: 100
          minimum: 1
        description: Maximum eligible invoice rows to select from staging.
      responses:
        '200':
          description: Batch processing attempt completed; inspect per-company and per-invoice results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuadientBatchImportResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A batch import is already running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'
  /quadient/invoice/reprocess/{stagingId}:
    post:
      tags:
      - Quadient Inbound
      summary: Mark an invoice ready for another import attempt
      description: Operational write endpoint. Sets QuadientInvoiceStaging.ProcessingStatus to ReadyForDIM
        and returns HTTP 202; it DOES NOT import the invoice immediately, remove previously failed Sage DIM
        rows, or verify absence of an existing voucher. Do not invoke until old sessions and duplicates have
        been safely reconciled.
      parameters:
      - name: stagingId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '202':
          description: Invoice status changed to ReadyForDIM (not yet imported)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: reprocess_started
                  stagingId:
                    type: integer
                  invoiceNumber:
                    type: string
                  vendorId:
                    type: string
                  companyId:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
  parameters:
    UpdatedSince:
      name: updatedSince
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Return records updated on or after this date/time where supported.
      example: '2026-05-01T00:00:00Z'
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number, starting at 1.
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Number of rows or header records requested per page. Default and maximum depend on endpoint;
        most endpoints default to 100 and cap at 500, while /gl-accounts defaults to 500 and caps at 1000.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
      example: 500
    Offset:
      name: offset
      in: query
      required: false
      description: '

        Zero-based record offset. If supplied, offset takes priority over page.

        For example, offset=0&pageSize=500 returns rows 1-500, and

        offset=500&pageSize=500 returns rows 501-1000.

        '
      schema:
        type: integer
        minimum: 0
        default: 0
      example: 0
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Unauthorized
            message: Missing or invalid API key
    ServerError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: QUERY_FAILED
            message: Database query failed
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: OK
    DbTestResponse:
      type: object
      properties:
        CurrentDB:
          type: string
          example: mas500_app
        LoginUser:
          type: string
        ServerTime:
          type: string
          format: date-time
    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 100
    PagedResponseBase:
      type: object
      properties:
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 100
        count:
          type: integer
          example: 1
    CompanyList:
      allOf:
      - $ref: '#/components/schemas/PagedResponseBase'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/Company'
    Company:
      type: object
      properties:
        companyId:
          type: string
          example: '001'
        companyName:
          type: string
          example: Summit Interconnect
    GLAccountList:
      allOf:
      - $ref: '#/components/schemas/PagedResponseBase'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/GLAccount'
    GLAccount:
      type: object
      properties:
        accountNumber:
          type: string
          example: 4000-000
        description:
          type: string
          example: Sales Revenue
        active:
          type: integer
          description: 1 = active, 0 = inactive
          example: 1
    CustomerList:
      allOf:
      - $ref: '#/components/schemas/PagedResponseBase'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/Customer'
    Customer:
      type: object
      properties:
        customerId:
          type: string
          example: CUST001
        customerName:
          type: string
          example: ABC Customer
        companyId:
          type: string
          example: '001'
    VendorList:
      allOf:
      - $ref: '#/components/schemas/PagedResponseBase'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/Vendor'
    Vendor:
      type: object
      properties:
        vendorId:
          type: string
          example: INSUL
        vendorName:
          type: string
          example: Insulectro (EFT)
        companyId:
          type: string
          nullable: true
          example: '001'
        updatedAt:
          type: string
          format: date-time
          nullable: true
        vendorKey:
          type: integer
          nullable: true
          description: Sage 500 tapVendor.VendKey; identifier returned as vendorKey.
          example: 12345
        active:
          type: boolean
          description: True when Sage tapVendor.Status = 1; inactive vendors are also included.
          example: true
    PurchaseOrderList:
      allOf:
